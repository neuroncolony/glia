<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script>try{if(localStorage.getItem('glia.theme')==='dev')document.documentElement.setAttribute('data-theme','dev')}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{BRAND}} · Compare</title><meta name="description" content="{{DESCRIPTION}}">
<link rel="stylesheet" href="static/styles.css"><script src="static/shell.js" defer></script><script src="static/features.js" defer></script>
<style>
.cp-pick{display:grid;grid-template-columns:1fr auto 1fr;gap:.8rem;align-items:center;margin:1rem 0 1.25rem}.cp-pick select{font:inherit;padding:.8rem 1rem;border-radius:14px;border:1px solid rgba(11,26,51,.12);background:rgba(255,255,255,.8)}
.cp-vs{font-family:Outfit,system-ui;font-weight:700;font-size:1.3rem;opacity:.5}
.cp-head{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}.cp-head .card{display:flex;align-items:center;gap:.8rem;padding:1.1rem}.cp-head img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#eef2f7}
.cp-head b{font-family:Outfit,system-ui;font-size:1.35rem}.cp-head small{display:block;opacity:.55}.cp-score{margin-left:auto;font-family:Outfit,system-ui;font-size:2rem;font-weight:700}
.cp-row{display:grid;grid-template-columns:1fr 150px 1fr;gap:1rem;align-items:center;padding:.8rem 1.1rem;border-bottom:1px solid rgba(11,26,51,.07)}.cp-row:last-child{border-bottom:0}
.cp-row span{font-variant-numeric:tabular-nums;font-weight:600}.cp-row span:last-child{text-align:right}.cp-row em{font-style:normal;text-align:center;font-size:.8rem;opacity:.55}
.cp-win{color:#15803d}.cp-win::after{content:' ▲';font-size:.7rem}
@media(max-width:700px){.cp-pick{grid-template-columns:1fr}.cp-vs{text-align:center}.cp-row{grid-template-columns:1fr 90px 1fr}}
</style></head>
<body><header class="nav" id="nav"></header>
<main class="page"><div class="wrap"><section class="section">
<div class="section-head"><div><div class="eyebrow">Compare</div><h2>Head to head</h2></div></div>
<p class="hint" style="margin:0">Pick any two Glia coins and see them side by side: price, market cap, volume, trades, holders and graduation. The winner of each stat gets a point.</p>
<div class="cp-pick"><select id="cp-a"></select><span class="cp-vs">VS</span><select id="cp-b"></select></div>
<div id="cp-out"><div class="empty">Loading coins…</div></div>
</section></div></main>
<footer class="footer" id="footer"></footer>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { api, esc, fmtUsd, href, short } = GLIA;
  const $ = s => document.querySelector(s);
  let toks = [], holders = {};
  const age = s => s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd';
  async function hc(t) { if (holders[t] == null) { try { holders[t] = (await api('holders?token=' + t)).count || 0; } catch (e) { holders[t] = 0; } } return holders[t]; }
  async function render() {
    const A = toks.find(t => t.token === $('#cp-a').value), B = toks.find(t => t.token === $('#cp-b').value);
    if (!A || !B) return;
    const [ha, hb] = await Promise.all([hc(A.token), hc(B.token)]);
    const stats = [
      ['Market cap', A.marketCapUsd || 0, B.marketCapUsd || 0, v => fmtUsd(v)],
      ['Price', A.priceUsd || 0, B.priceUsd || 0, v => '$' + (v ? v.toExponential(3) : '0')],
      ['24h volume', A.volume24hUsd || 0, B.volume24hUsd || 0, v => fmtUsd(v)],
      ['24h trades', A.trades24h || 0, B.trades24h || 0, v => String(v)],
      ['Holders', ha, hb, v => String(v)],
      ['Graduation', A.graduation || 0, B.graduation || 0, v => (v * 100).toFixed(v < .1 ? 2 : 1) + '%'],
    ];
    let sa = 0, sb = 0;
    const rows = stats.map(([k, a, b, f]) => { const wa = a > b, wb = b > a; sa += wa; sb += wb; return `<div class="cp-row"><span class="${wa ? 'cp-win' : ''}">${f(a)}</span><em>${k}</em><span class="${wb ? 'cp-win' : ''}">${f(b)}</span></div>`; }).join('')
      + `<div class="cp-row"><span>${age(A.age || 0)}</span><em>Age</em><span>${age(B.age || 0)}</span></div><div class="cp-row"><span>${esc(A.status || '')}</span><em>Stage</em><span>${esc(B.status || '')}</span></div>`;
    const card = (t, s, o) => `<a class="card" style="color:inherit;text-decoration:none" href="${href('/token/' + t.token)}"><img src="${esc(href('/api/token/' + t.token + '/logo'))}" alt="" onerror="this.style.visibility='hidden'"><span><b>$${esc(t.symbol || short(t.token))}</b><small>${esc(t.name || '')}</small></span><span class="cp-score" style="color:${s > o ? '#15803d' : 'inherit'}">${s}</span></a>`;
    $('#cp-out').innerHTML = `<div class="cp-head">${card(A, sa, sb)}${card(B, sb, sa)}</div><div class="card" style="padding:0">${rows}</div>`;
    history.replaceState(null, '', '?a=' + A.token + '&b=' + B.token);
  }
  try {
    toks = (await api('tokens?sort=mcap&limit=100')).tokens || [];
    if (toks.length < 2) { $('#cp-out').innerHTML = '<div class="empty">Need at least two coins to compare.</div>'; return; }
    const opts = toks.map(t => `<option value="${esc(t.token)}">$${esc(t.symbol || short(t.token))} · ${esc(t.name || '')}</option>`).join('');
    $('#cp-a').innerHTML = opts; $('#cp-b').innerHTML = opts;
    const q = new URLSearchParams(location.search), has = v => toks.some(t => t.token.toLowerCase() === (v || '').toLowerCase());
    $('#cp-a').value = has(q.get('a')) ? toks.find(t => t.token.toLowerCase() === q.get('a').toLowerCase()).token : toks[0].token;
    $('#cp-b').value = has(q.get('b')) ? toks.find(t => t.token.toLowerCase() === q.get('b').toLowerCase()).token : toks[1].token;
    $('#cp-a').onchange = render; $('#cp-b').onchange = render; render();
  } catch (e) { $('#cp-out').innerHTML = `<div class="empty">${esc(e.message || 'Could not load coins.')}</div>`; }
});
</script></body></html>
