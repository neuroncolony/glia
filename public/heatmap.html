<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script>try{if(localStorage.getItem('glia.theme')==='dev')document.documentElement.setAttribute('data-theme','dev')}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{BRAND}} · Heatmap</title><meta name="description" content="{{DESCRIPTION}}">
<link rel="stylesheet" href="static/styles.css"><script src="static/shell.js" defer></script><script src="static/features.js" defer></script>
<style>
.hm-top{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin:1rem 0 1.25rem}.hm-top .card{padding:1rem 1.1rem}.hm-top b{display:block;font-size:1.5rem;margin-top:.3rem;font-family:Outfit,system-ui}
.hm-bar{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.hm-tabs{display:flex;gap:.4rem;flex-wrap:wrap}.hm-tabs button{font:inherit;font-size:.85rem;padding:.4rem .85rem;border-radius:999px;border:1px solid rgba(11,26,51,.12);background:rgba(255,255,255,.7);cursor:pointer}.hm-tabs button.on{background:#0b1a33;color:#fff}
.hm-map{position:relative;height:560px;padding:0;overflow:hidden}
.hm-tile{position:absolute;box-sizing:border-box;border:3px solid rgba(255,255,255,.85);border-radius:14px;color:#fff;text-decoration:none;padding:.9rem 1rem;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:left .6s,top .6s,width .6s,height .6s,background .6s,transform .2s}
.hm-tile:hover{transform:scale(1.01);z-index:2;box-shadow:0 20px 40px -18px rgba(11,26,51,.5)}
.hm-tile .hd{display:flex;align-items:center;gap:.55rem;min-width:0}.hm-tile img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.3);flex:none}
.hm-tile b{font-family:Outfit,system-ui;font-size:1.35rem;line-height:1}.hm-tile small{display:block;opacity:.8;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-tile .big{font-family:Outfit,system-ui;font-size:1.9rem;font-weight:600;line-height:1}.hm-tile .ft{display:flex;justify-content:space-between;gap:.5rem;font-size:.8rem;opacity:.9;flex-wrap:wrap}
.hm-tile.sm .big{font-size:1.2rem}.hm-tile.sm .ft,.hm-tile.sm small{display:none}.hm-tile.xs img,.hm-tile.xs .big{display:none}
.hm-legend{display:flex;align-items:center;gap:.6rem;font-size:.8rem;opacity:.75}.hm-legend i{display:block;width:180px;height:10px;border-radius:999px;background:linear-gradient(90deg,#dc2626,#94a3b8,#16a34a)}
@media(max-width:760px){.hm-top{grid-template-columns:repeat(2,1fr)}.hm-map{height:460px}}
</style></head>
<body><header class="nav" id="nav"></header>
<main class="page"><div class="wrap"><section class="section">
<div class="section-head"><div><div class="eyebrow">Heatmap</div><h2>The whole market at a glance</h2></div></div>
<p class="hint" style="margin:0">Every Glia coin as a tile. Bigger tile, bigger coin. Greener tile, more buying. Live from the chain, updates every 20 seconds.</p>
<div class="hm-top" id="hm-top"></div>
<div class="hm-bar"><div class="hm-tabs" id="hm-size"><button class="on" data-s="mcap">Size: market cap</button><button data-s="vol">Size: volume</button><button data-s="trades">Size: trades</button></div>
<div class="hm-tabs" id="hm-win"><button data-w="3600">1h</button><button class="on" data-w="86400">24h</button><button data-w="604800">7d</button></div></div>
<div class="card hm-map" id="hm-map"><div class="empty">Reading the chain…</div></div>
<div class="hm-bar" style="margin-top:.75rem"><div class="hm-legend"><span>Selling</span><i></i><span>Buying</span></div><span class="hint" id="hm-upd"></span></div>
</section></div></main>
<footer class="footer" id="footer"></footer>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { api, esc, fmtUsd, href, short } = GLIA;
  const $ = s => document.querySelector(s);
  let coins = [], trades = [], ethUsd = 0, sizeBy = 'mcap', win = 86400;
  const wei = v => Number(v || 0) / 1e18;
  function squarify(items, x, y, w, h, out) {
    if (!items.length) return;
    if (items.length === 1) { out.push({ ...items[0], x, y, w, h }); return; }
    const total = items.reduce((a, b) => a + b.v, 0); let acc = 0, i = 0;
    while (i < items.length - 1 && acc + items[i].v <= total / 2) acc += items[i++].v;
    if (i === 0) acc = items[i++].v;
    const a = items.slice(0, i), b = items.slice(i), f = acc / total;
    if (w >= h) { squarify(a, x, y, w * f, h, out); squarify(b, x + w * f, y, w * (1 - f), h, out); }
    else { squarify(a, x, y, w, h * f, out); squarify(b, x, y + h * f, w, h * (1 - f), out); }
  }
  function color(p) {
    const t = Math.max(-1, Math.min(1, p)), g = [22, 163, 74], r = [220, 38, 38], n = [148, 163, 184], k = Math.abs(t), c = t >= 0 ? g : r;
    return `rgb(${n.map((v, j) => Math.round(v + (c[j] - v) * (.25 + .75 * k))).join(',')})`;
  }
  function render() {
    const now = Date.now() / 1000, flow = {};
    trades.forEach(t => { if (!t.at || now - t.at > win) return; const k = String(t.token).toLowerCase(), f = flow[k] || (flow[k] = { buy: 0, sell: 0, n: 0 }); f[t.side === 'buy' ? 'buy' : 'sell'] += wei(t.ethWei); f.n++; });
    const rows = coins.map(c => { const f = flow[String(c.token).toLowerCase()] || { buy: 0, sell: 0, n: 0 }, tot = f.buy + f.sell;
      return { ...c, buy: f.buy, sell: f.sell, n: f.n, press: tot ? (f.buy - f.sell) / tot : 0, buyPct: tot ? f.buy / tot : .5,
        mcap: Number(c.marketCapUsd || 0), vol: tot * ethUsd || Number(c.volume24hUsd || 0) * (win === 86400 ? 1 : 0), trades: f.n }; });
    const metric = r => sizeBy === 'mcap' ? r.mcap : sizeBy === 'vol' ? r.vol : r.trades;
    const items = rows.map(r => ({ ...r, v: Math.max(metric(r), 1e-9) })).sort((a, b) => b.v - a.v);
    const tv = items.reduce((a, b) => a + b.v, 0); items.forEach(r => r.v = Math.max(r.v, tv * .03));
    const map = $('#hm-map'), W = map.clientWidth, H = map.clientHeight, out = [];
    if (!items.length) { map.innerHTML = `<div class="empty">No coins yet. <a href="${href('/launch')}">Launch one →</a></div>`; return; }
    squarify(items, 0, 0, W, H, out);
    const lbl = win === 3600 ? '1h' : win === 86400 ? '24h' : '7d';
    map.innerHTML = out.map(r => { const cls = r.w < 150 || r.h < 110 ? (r.w < 90 || r.h < 70 ? 'sm xs' : 'sm') : '';
      return `<a class="hm-tile ${cls}" href="${href('/token/' + r.token)}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${color(r.press)}">
      <div class="hd"><img src="${esc(href('/api/token/' + r.token + '/logo'))}" alt="" onerror="this.style.visibility='hidden'"><div style="min-width:0"><b>$${esc(r.symbol || short(r.token))}</b><small>${esc(r.name || '')}</small></div></div>
      <div class="big">${sizeBy === 'trades' ? r.trades + ' trades' : fmtUsd(sizeBy === 'mcap' ? r.mcap : r.vol)}</div>
      <div class="ft"><span>${Math.round(r.buyPct * 100)}% buys ${lbl}</span><span>${r.n ? fmtUsd((r.buy + r.sell) * ethUsd) + ' vol' : 'No trades'}</span></div></a>`; }).join('');
    const buyers = rows.filter(r => r.press > 0).length, all = rows.reduce((a, r) => a + (r.buy + r.sell), 0), b = rows.reduce((a, r) => a + r.buy, 0);
    const top = [...rows].sort((a, c) => (c.n ? c.press : -2) - (a.n ? a.press : -2))[0];
    $('#hm-top').innerHTML = `<div class="card"><span class="hint">Total market cap</span><b>${fmtUsd(rows.reduce((a, r) => a + r.mcap, 0))}</b></div><div class="card"><span class="hint">Volume ${lbl}</span><b>${fmtUsd(all * ethUsd)}</b></div><div class="card"><span class="hint">Market mood ${lbl}</span><b>${all ? Math.round(b / all * 100) + '% buys' : '·'}</b></div><div class="card"><span class="hint">Most bought</span><b>${top && top.n ? '$' + esc(top.symbol) + ' · ' + Math.round(top.buyPct * 100) + '%' : '·'}</b></div>`;
    $('#hm-upd').textContent = `${rows.length} coins · ${buyers} with more buying than selling`;
  }
  async function load() {
    try {
      const [d, t, s] = await Promise.all([api('tokens?limit=100'), api('trades?limit=500').catch(() => ({ trades: [] })), api('stats').catch(() => ({}))]);
      coins = d.tokens || []; trades = t.trades || []; ethUsd = s.ethUsd || ethUsd; render();
    } catch (e) { $('#hm-map').innerHTML = `<div class="empty">${esc(e.message || 'Could not load the heatmap.')}</div>`; }
  }
  const tab = (id, key, set) => $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; set(b.dataset[key]); document.querySelectorAll(id + ' button').forEach(x => x.classList.toggle('on', x === b)); render(); };
  tab('#hm-size', 's', v => sizeBy = v); tab('#hm-win', 'w', v => win = Number(v));
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
  load(); setInterval(load, 20000);
});
</script></body></html>
