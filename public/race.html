<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script>try{if(localStorage.getItem('glia.theme')==='dev')document.documentElement.setAttribute('data-theme','dev')}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{BRAND}} · Race</title><meta name="description" content="{{DESCRIPTION}}">
<link rel="stylesheet" href="static/styles.css"><script src="static/shell.js" defer></script><script src="static/features.js" defer></script>
<style>
.rc-top{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin:1rem 0 1.25rem}.rc-top .card{padding:1rem 1.1rem}.rc-top b{display:block;font-size:1.5rem;margin-top:.3rem;font-family:Outfit,system-ui}
.rc-row{display:grid;grid-template-columns:34px 1.3fr 3fr 1fr 1fr;gap:1rem;align-items:center;padding:.9rem 1.1rem;border-bottom:1px solid rgba(11,26,51,.07);color:inherit;text-decoration:none}
.rc-row:hover{background:rgba(255,255,255,.55)}.rc-row:last-child{border-bottom:0}
.rc-pos{font-family:Outfit,system-ui;font-size:1.25rem;font-weight:600;opacity:.45}.rc-tok{display:flex;align-items:center;gap:.6rem;min-width:0}.rc-tok img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;background:#eef2f7}
.rc-tok small{display:block;opacity:.55;font-size:.78rem}
.rc-bar{position:relative;height:12px;border-radius:999px;background:rgba(11,26,51,.08);overflow:hidden}.rc-bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#86efac,#16a34a);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.rc-bar.done i{background:linear-gradient(90deg,#16a34a,#0b1a33)}.rc-meta{display:flex;justify-content:space-between;font-size:.78rem;opacity:.6;margin-top:.35rem}
.rc-num{text-align:right;font-variant-numeric:tabular-nums}.rc-num small{display:block;opacity:.55;font-size:.75rem}
.rc-flag{font-size:.72rem;padding:.2rem .5rem;border-radius:999px;background:#0b1a33;color:#fff;margin-left:.4rem}.rc-hot{background:#16a34a}
.rc-tabs{display:flex;gap:.4rem;margin-bottom:.75rem}.rc-tabs button{font:inherit;font-size:.85rem;padding:.4rem .85rem;border-radius:999px;border:1px solid rgba(11,26,51,.12);background:rgba(255,255,255,.7);cursor:pointer}.rc-tabs button.on{background:#0b1a33;color:#fff}
@media(max-width:760px){.rc-top{grid-template-columns:repeat(2,1fr)}.rc-row{grid-template-columns:26px 1fr 1fr}.rc-row .rc-num{display:none}.rc-row .rc-track{grid-column:2/4}}
</style></head>
<body><header class="nav" id="nav"></header>
<main class="page"><div class="wrap"><section class="section">
<div class="section-head"><div><div class="eyebrow">Graduation Race</div><h2>Who hits the DEX next</h2></div></div>
<p class="hint" style="margin:0">Every Glia coin on one track. Progress to graduation, ETH still needed and 24h momentum, live from the chain. Updates every 20 seconds.</p>
<div class="rc-top" id="rc-top"></div>
<div class="rc-tabs" id="rc-tabs"><button class="on" data-f="all">All coins</button><button data-f="racing">Racing</button><button data-f="grad">Graduated</button></div>
<div class="card" style="padding:0" id="rc-list"><div class="empty">Reading the chain…</div></div>
</section></div></main>
<footer class="footer" id="footer"></footer>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { api, esc, fmtUsd, href, short } = GLIA;
  const $ = s => document.querySelector(s);
  let rows = [], filter = 'all', ethUsd = 0;
  const wei = v => Number(v || 0) / 1e18;
  const usd = e => ethUsd ? fmtUsd(e * ethUsd) : e.toFixed(3) + ' ETH';
  function shape(t) {
    const cs = t.curveState || {}, grad = t.status === 'Graduated' || String(cs.graduated) === 'True' || t.phase === 2;
    const thr = wei(cs.graduationThreshold) || 4.2, raised = grad ? thr : wei(cs.ethReserve);
    const pct = grad ? 1 : Math.max(0, Math.min(1, t.graduation != null ? Number(t.graduation) : raised / thr));
    return { ...t, grad, thr, raised: grad ? thr : pct * thr, left: grad ? 0 : Math.max(0, thr - pct * thr), pct, vol: Number(t.volume24hEth || 0) };
  }
  function render() {
    const list = rows.filter(r => filter === 'all' || (filter === 'grad' ? r.grad : !r.grad));
    const racing = rows.filter(r => !r.grad), lead = racing[0], hot = [...racing].sort((a, b) => b.vol - a.vol)[0];
    $('#rc-top').innerHTML = `<div class="card"><span class="hint">Coins on the track</span><b>${rows.length}</b></div><div class="card"><span class="hint">Graduated</span><b>${rows.filter(r => r.grad).length}</b></div><div class="card"><span class="hint">Race leader</span><b>${lead ? '$' + esc(lead.symbol) + ' · ' + (lead.pct * 100).toFixed(1) + '%' : '·'}</b></div><div class="card"><span class="hint">Leader needs</span><b>${lead ? usd(lead.left) : '·'}</b></div>`;
    if (!list.length) { $('#rc-list').innerHTML = `<div class="empty">No coins here yet. <a href="${href('/launch')}">Launch one →</a></div>`; return; }
    $('#rc-list').innerHTML = list.map((r, i) => `<a class="rc-row" href="${href('/token/' + r.token)}">
      <span class="rc-pos">${i + 1}</span>
      <span class="rc-tok"><img src="${esc(href('/api/token/' + r.token + '/logo'))}" alt="" onerror="this.style.visibility='hidden'"><span><b>$${esc(r.symbol || short(r.token))}</b>${r.grad ? '<span class="rc-flag">On DEX</span>' : ''}${hot && hot === r && r.vol > 0 ? '<span class="rc-flag rc-hot">Hot</span>' : ''}<small>${esc(r.name || '')}</small></span></span>
      <span class="rc-track"><div class="rc-bar ${r.grad ? 'done' : ''}"><i style="width:0" data-w="${(r.pct * 100).toFixed(2)}%"></i></div><div class="rc-meta"><span>${(r.pct * 100).toFixed(r.pct < .1 ? 2 : 1)}%</span><span>${r.grad ? 'Graduated' : usd(r.left) + ' to go'}</span></div></span>
      <span class="rc-num">${usd(r.vol)}<small>24h volume</small></span>
      <span class="rc-num">${r.marketCapUsd ? fmtUsd(r.marketCapUsd) : '·'}<small>Market cap</small></span></a>`).join('');
    requestAnimationFrame(() => document.querySelectorAll('.rc-bar i').forEach(el => el.style.width = el.dataset.w));
  }
  async function load() {
    try {
      const [d, s] = await Promise.all([api('tokens?limit=100'), api('stats').catch(() => ({}))]);
      ethUsd = s.ethUsd || 0;
      rows = (d.tokens || []).map(shape).sort((a, b) => (b.grad - a.grad) || (b.pct - a.pct) || (b.vol - a.vol));
      render();
    } catch (e) { $('#rc-list').innerHTML = `<div class="empty">${esc(e.message || 'Could not load the race.')}</div>`; }
  }
  $('#rc-tabs').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; document.querySelectorAll('#rc-tabs button').forEach(x => x.classList.toggle('on', x === b)); render(); };
  load(); setInterval(load, 20000);
});
</script></body></html>
